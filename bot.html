<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AakashPuree Bot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0e1621;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .phone {
    width: 370px;
    height: 680px;
    background: #17212b;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }
  .header {
    background: #232e3c;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #1e2c3a;
  }
  .avatar {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, #2ea6ff, #1a72cc);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .header-info h3 { color: #fff; font-size: 15px; font-weight: 600; }
  .header-info span { color: #5bc8f5; font-size: 12px; }
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    scrollbar-width: thin;
    scrollbar-color: #2b3d52 transparent;
  }
  .bubble {
    max-width: 78%;
    padding: 8px 12px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    animation: pop 0.2s ease;
  }
  @keyframes pop { from { opacity:0; transform: scale(0.92); } to { opacity:1; transform: scale(1); } }
  .user-bubble {
    background: #2b5278;
    color: #e8f4ff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .bot-bubble {
    background: #232e3c;
    color: #d1d8e0;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .time { font-size: 10px; color: #7a8c9e; margin-top: 2px; }
  .bot-time { text-align: left; }
  .user-time { text-align: right; }
  .typing {
    background: #232e3c;
    color: #7a8c9e;
    padding: 8px 14px;
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    align-self: flex-start;
    font-size: 13px;
    font-style: italic;
  }
  .input-row {
    padding: 10px 12px;
    background: #232e3c;
    display: flex;
    gap: 8px;
    align-items: center;
    border-top: 1px solid #1e2c3a;
  }
  .msg-input {
    flex: 1;
    background: #17212b;
    border: none;
    border-radius: 20px;
    padding: 10px 16px;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  .msg-input::placeholder { color: #4a5f75; }
  .send-btn {
    width: 40px; height: 40px;
    background: #2ea6ff;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: #1a8ce0; }
  .send-btn svg { width: 18px; height: 18px; fill: white; }
  .quick-btns {
    padding: 6px 10px 2px;
    display: flex; gap: 6px; flex-wrap: wrap;
    background: #17212b;
  }
  .quick-btn {
    background: #232e3c;
    color: #2ea6ff;
    border: 1px solid #2b3d52;
    border-radius: 14px;
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .quick-btn:hover { background: #2b3d52; }
</style>
</head>
<body>

<div class="phone">
  <div class="header">
    <div class="avatar">🤖</div>
    <div class="header-info">
      <h3>AakashPuree Bot</h3>
      <span>● online</span>
    </div>
  </div>

  <div class="quick-btns">
    <button class="quick-btn" onclick="quickSend('hi')">hi</button>
    <button class="quick-btn" onclick="quickSend('how are you')">how are you</button>
    <button class="quick-btn" onclick="quickSend('who are you')">who are you</button>
    <button class="quick-btn" onclick="quickSend('tell me a joke')">joke</button>
    <button class="quick-btn" onclick="quickSend('bye')">bye</button>
  </div>

  <div class="chat-area" id="chatArea"></div>

  <div class="input-row">
    <input class="msg-input" id="msgInput" placeholder="Message..."
      onkeydown="if(event.key==='Enter') sendMsg()" />
    <button class="send-btn" onclick="sendMsg()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
const replies = {
  'hi':                'Hello! 👋 I am Chatbot. How can I help you today?',
  'hello':             'Hi there! 😊 I am Chatbot. What can I do for you?',
  'hey':               'Hey! 👋 Nice to meet you! How can I help?',
  'hii':               'Hello! 👋 I am Chatbot. How are you?',
  'how are you':       'I am doing great, thank you! 😄 How about you?',
  'how r u':           'I am fine! 😊 Thanks for asking. How are you?',
  'hows it going':     'All good here! 🙌 How can I help?',
  'what are you':      'I am a Chatbot 🤖 built to chat with you on Telegram!',
  'who are you':       'I am Chatbot 🤖 — your friendly Telegram assistant!',
  'what is your name': 'My name is Chatbot 🤖. Nice to meet you!',
  'whats your name':   "I am called Chatbot 🤖. What's yours?",
  'tell me a joke':    "😂 Why don't scientists trust atoms?\nBecause they make up everything!",
  'joke':              '😂 Why did the computer go to the doctor?\nBecause it had a virus!',
  'thanks':            'You\'re welcome! 😊',
  'thank you':         'My pleasure! 😊 Anything else I can help with?',
  'thx':               'No problem! 😊',
  'bye':               'Goodbye! 👋 Have a wonderful day!',
  'goodbye':           'See you later! 👋 Take care!',
  'see you':           'See you! 😊 Come back anytime!',
  'help':              'Try saying:\n• hi / hello\n• how are you\n• who are you\n• tell me a joke\n• bye',
};

function getTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function addMsg(text, who) {
  const area = document.getElementById('chatArea');
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;align-items:' + (who === 'user' ? 'flex-end' : 'flex-start');

  const bub = document.createElement('div');
  bub.className = 'bubble ' + (who === 'user' ? 'user-bubble' : 'bot-bubble');
  bub.innerText = text;

  const t = document.createElement('div');
  t.className = 'time ' + (who === 'bot' ? 'bot-time' : 'user-time');
  t.innerText = getTime();

  wrap.appendChild(bub);
  wrap.appendChild(t);
  area.appendChild(wrap);
  area.scrollTop = area.scrollHeight;
}

function getReply(input) {
  const lower = input.toLowerCase().trim();
  for (const [key, val] of Object.entries(replies)) {
    if (lower === key || lower.includes(key)) return val;
  }
  return "🤔 I didn't understand that.\nTry saying hi, how are you, or help!";
}

function sendMsg() {
  const inp = document.getElementById('msgInput');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  addMsg(text, 'user');

  const area = document.getElementById('chatArea');
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerText = 'typing...';
  area.appendChild(typing);
  area.scrollTop = 9999;

  setTimeout(() => {
    typing.remove();
    addMsg(getReply(text), 'bot');
  }, 700);
}

function quickSend(txt) {
  document.getElementById('msgInput').value = txt;
  sendMsg();
}

// Welcome message on load
setTimeout(() => addMsg('Hello! 👋 I am Chatbot. Type anything to chat with me!', 'bot'), 400);
</script>
</body>
</html>
